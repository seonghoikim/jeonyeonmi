name: Investigate egress

# Manual, read-only: prints where Supabase Storage traffic came from (file paths, user-agents,
# byte counts — no IPs, since this repo's logs are public). Needs SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tkbfgxxwsfxhdhjnrdqv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/investigate-egress.mjs
