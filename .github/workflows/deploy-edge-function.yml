name: Deploy Edge Function

# Deploys supabase/functions/server to Supabase whenever it changes on main (or on demand),
# so a server-side change no longer waits for someone to run the CLI by hand.
# Needs the repo secret SUPABASE_ACCESS_TOKEN; without it the job only warns and exits green.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: deploy-edge-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: tkbfgxxwsfxhdhjnrdqv
      FUNCTION_SLUG: make-server-9c6a1cce
    steps:
      - uses: actions/checkout@v4

      - name: Check for deploy token
        id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set - the Edge Function was NOT deployed. See README (Deploy)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.gate.outputs.ok == 'true'
        name: Deploy
        run: supabase functions deploy "$FUNCTION_SLUG" --project-ref "$PROJECT_REF"

      # The anon key is public (it ships in the site's own JS bundle), so it's fine inline.
      - if: steps.gate.outputs.ok == 'true'
        name: Health check
        run: |
          sleep 5
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrYmZneHh3c2Z4aGRoam5yZHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NDk5NjMsImV4cCI6MjA5OTIyNTk2M30.8UD570SWzih34oYy-yC1sB0oASA843NtmBplOMfc4DY" \
            "https://$PROJECT_REF.supabase.co/functions/v1/$FUNCTION_SLUG/health")
          cat /tmp/health.json; echo
          test "$code" = "200"
